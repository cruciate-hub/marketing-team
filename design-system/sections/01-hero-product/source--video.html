        position: relative;

        clip-path: inset(0.125rem);
        border-radius: 1rem;
        width: 100%;
        max-width: 100%;
        height: 100%;
        max-height: 100%;
        margin-left: auto;
        margin-right: auto;
        padding: 0;
        display: block;
        position: relative;
        overflow: hidden;

        border-radius: 1rem;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
      }
      .main-hero_text-content {
        width: 100%;
        max-width: 100%;
      }
      .cta-button {
        background-color: var(--social--main-blue);
        color: var(--main--white);
        cursor: pointer;
        border-radius: 10em;
        flex-direction: column;
        flex: none;
        justify-content: center;
        align-items: center;
        padding: 0.125rem;
        text-decoration: none;
        display: inline-flex;
        position: relative;
        overflow: hidden;
      }
      .cta-border_rotate {
        grid-column-gap: 1rem;
        grid-row-gap: 1rem;
        pointer-events: none;
        cursor: auto;
        grid-template-rows: auto auto;
        grid-template-columns: 1fr 1fr;
        grid-auto-columns: 1fr;
        width: 100%;
        min-height: 12rem;
        position: absolute;
      }
      .cta-button_bg {
        z-index: 1;
        background-image: linear-gradient(90deg, var(--social--main-blue), var(--social--button-hover));
        white-space: nowrap;
        border-radius: 25em;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 100%;
        height: 100%;
        min-height: 2.8rem;
        max-height: 100%;
        padding: 0.5rem 1.5rem;
        display: flex;

        .main-hero_text-content {
