      <div class="hide w-embed w-script">
        <!-- Stat band — "magnetic segment" (v2.6.0).
     Replaces the earlier single-bar mouse-follow script, which drove these same
     .hmpg_no-line elements - running both would fight over transform.

     v2.6.0: the segment's opacity is now a plain native style (.hmpg_no-line,
     opacity .9) instead of something this script lerps every frame. There is
     always exactly one active stat - at rest it is column 1 - so a dimmed
     "inactive" bar no longer means anything. The script is left doing only what
     CSS genuinely cannot: the position.
     v2.5.0: the intro sweep was removed (it read as autoplay). Nothing runs
     until someone hovers.

     Behaviour:
       SNAPPING   the segment always heads for one of the four column centres,
                  never a point in between. The cursor decides WHICH column
                  (nearest centre to the pointer X); the target is that column's
                  centre. At rest the target is column 1.
       REST       the column the segment rests under keeps the full hover
                  styling (white number, lifted + scaled, lighter label), so the
                  band never shows a bar sitting under a dim number.
       MOTION     one rAF loop, no CSS transition on the segment - that is what
                  lets the two rules lag apart and settle at a different rate:
                    per frame  pos += (target - pos) * ease; translateX(pos-180)
                    ease       tracking .17 top / .10 bottom; at rest .045/.033
                  the loop parks 160 frames after leaving, restarts on the next
                  pointer move.

     Stat highlight is class-driven so the easing stays in the stylesheet
     (hmpg_no-on / hmpg_no_description-on). IMPORTANT: those combos are added at
     runtime, so column 1 carries them permanently in the Designer - otherwise
     Webflow lists them as unused classes and a cleanup silently deletes them,
     which kills the white highlight everywhere.

     BELOW 992px the whole interaction is off - no tracking, no highlight
     classes - and the segments are hidden, so the band is simply static there.
     Numbers are plain white and labels the site grey via native breakpoint
     overrides in the stylesheet.

     Measurements re-sync on load, fonts.ready and resize: this script runs
     inline while the page is still parsing, so its first measurement can land
     before the band has its final width (measured: segment parked at x=64
     instead of column 1 at x=148). While idle, a re-sync also re-pins it. -->
      </div>
    </section>
