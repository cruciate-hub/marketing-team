    <!-- G2 Sub-nav (blog). Captured 2026-10-07 from https://www.social.plus/blog by design-system/capture/capture.mjs. Images are copies of the site's own files in design-system/assets/media/ (capture/localize-media.mjs); videos are not copied, a <video> shows its first frame as poster. -->
    <!-- sub-nav (blog variant): the same bar with the blog categories. -->
    <div class="sub-navbar">
      <div class="css w-embed">
        <style>
          .sub-navbar {
            position: sticky !important;
            z-index: 998 !important;
          }
          /* Geen blauwe browser-tap-highlight (rgba(51,181,229,.4)) over de subnav-knoppen
     bij het tikken op mobiel — anders "flitst" de grijze pill blauw. */
          .sub-navbar a,
          .sub-navbar .product-nav_dropdown-toggle {
            -webkit-tap-highlight-color: transparent !important;
          }
          /* De hoofdbalk verliest zijn onderrand/onderhoeken zodat de sub-navbar
     er naadloos op aansluit. */
          .nav_mega-menu_wrapper {
            border-bottom: none !important;
            border-bottom-left-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
          }
          /* ...maar als het MOBIELE menu open is, staat de hoofdbalk weer los. */
          body.sp-mnav-open .nav_mega-menu_wrapper {
            border-bottom: 1px solid var(--border--border-hover) !important;
            border-bottom-left-radius: 0.25rem !important;
            border-bottom-right-radius: 0.25rem !important;
          }
          @media (max-width: 47.9375em) {
            /* scrollbar verbergen; uniforme tussenruimte via één gap */
            .sub-navbar_content {
              scrollbar-width: none;
              -ms-overflow-style: none;
              -webkit-overflow-scrolling: touch;
              align-items: center;
              gap: 0.5rem;
            }
            .sub-navbar_content::-webkit-scrollbar {
              display: none;
              width: 0;
              height: 0;
            }
            .sub-navbar_links-wrapper {
              gap: 0.5rem;
              align-items: center;
            }
            /* Tabs als menu-pills — beide tab-classes + dropdown-items en -parents. */
            .sub-nav_link,
            .submenu-nav_link,
            .subnav-dropdown-link,
            .product-nav_dropdown-toggle {
              flex: 0 0 auto !important;
              width: auto !important;
              min-width: 0 !important;
              margin: 0 !important;
              border: 0 !important;
              background-color: var(--social--grey) !important;
              border-radius: 999px !important;
              padding: 0.5rem 1rem !important;
              align-self: center !important;
            }
            .sub-nav_link .sub-nav_link-text,
            .submenu-nav_link .sub-nav_link-text,
            .subnav-dropdown-link .sub-nav_link-text,
            .product-nav_dropdown-toggle .sub-nav_link-text {
              color: #fff !important;
            }
            /* Product-icoon in de toggle wit maken (de SVG gebruikt currentColor). */
            .product-nav_dropdown-toggle .nav-icon-embed {
              color: #fff !important;
            }
            /* Actief = blauw: reguliere tabs én de dropdown-parent-toggle die w--current is. */
            .sub-nav_link.w--current,
            .submenu-nav_link.w--current,
            .subnav-dropdown-link.w--current,
            .product-nav_dropdown-toggle.w--current {
              background-color: var(--social--main-blue) !important;
            }
            /* Chevron in de toggle verbergen (beide varianten). */
            .product-nav_dropdown-toggle .nav_dropdown-icon {
              display: none !important;
            }
            /* Product-icoon links op de dropdown-parent-pill (Social/Chat/Video):
       toon op mobiel de DESKTOP-variant (heeft icoon + echte link + native w--current). */
            .product-nav_dropdown-toggle.is-desktop {
              display: flex !important;
              align-items: center;
            }
            .product-nav_dropdown-toggle.is-responsive {
              display: none !important;
            }
            /* Dropdown-wrappers: geen marge/padding zodat de tussenruimte uniform blijft. */
            .product-nav_dropdown {
              display: flex !important;
              align-items: center;
              margin: 0 !important;
              padding: 0 !important;
            }
            /* "Docs" (externe link): 32px rechtermarge op het externe-link-icoon weghalen. */
            .subnav-docs-icon {
              margin-right: 0 !important;
            }
            /* "Modules"-dropdown op /product platslaan tot directe Social/Chat/Video-pills. */
            .product-nav_dropdown.is-module .product-nav_dropdown-toggle {
              display: none !important;
            }
            .product-nav_dropdown.is-module {
              gap: 0.5rem;
            }
            .product-nav_dropdown.is-module .product-nav_dropdown-list_desktop {
              display: flex !important;
              position: static !important;
              inset: auto !important;
              flex-direction: row;
              gap: 0.5rem;
              background: transparent !important;
              border: 0 !important;
              box-shadow: none !important;
              padding: 0 !important;
              margin: 0 !important;
              min-width: 0 !important;
              width: auto !important;
              transform: none !important;
              opacity: 1 !important;
              visibility: visible !important;
            }
          }
        </style>
      </div>

                    fill="currentColor"
                  ></path>
                </svg>
              </div>
              <div class="sub-nav_link-text">Search</div>
            </div></a
          >
        </div>
      </div>
