    <!-- 05 Hero / vs. Captured 2026-10-07 from https://www.social.plus/vs/circle by design-system/website/capture/capture.mjs. Images are the site's own CDN files. -->
    <!-- hero (vs): entrance animation and glow breathing live in the <style> embed below; with reduced motion they are off. -->
    <section id="main-content" class="vs-hero">
      <div class="hide w-embed">
        <style>
          /* vs-hero entrance + glow breathing in CSS, so it starts on first paint (no wait for scripts). Edit timings here.
   Order: "vs" settles first (~1.2s), the logos glide in until ~2.2s, the glows fade up until ~2.6s and then breathe. */
          @keyframes vs-hero-glow {
            from {
              opacity: 0;
              scale: 0.92;
            }
          }
          @keyframes vs-hero-breathe {
            to {
              opacity: 0.82;
              transform: scale(1.05);
            }
          }
          @keyframes vs-hero-fade {
            from {
              opacity: 0;
              filter: blur(6px);
            }
          }
          @keyframes vs-hero-in-left {
            from {
              transform: translateX(-36px);
            }
          }
          @keyframes vs-hero-in-right {
            from {
              transform: translateX(36px);
            }
          }
          @keyframes vs-hero-vs-in {
            from {
              opacity: 0;
              transform: scale(0.8);
              filter: blur(14px);
            }
          }
          .vs-hero_layer[data-motion="breathe"] {
            animation:
              vs-hero-glow 2.4s cubic-bezier(0.33, 1, 0.68, 1) both,
              vs-hero-breathe 4.5s ease-in-out 2.4s infinite alternate;
          }
          .vs-hero_layer[data-motion="breathe"] ~ .vs-hero_layer[data-motion="breathe"] {
            animation-delay: 0.2s, 3.2s;
            animation-duration: 2.4s, 5.2s;
          }
          .vs-hero_title > .vs-hero_brand {
            animation:
              vs-hero-fade 1.3s ease-out 0.3s both,
              vs-hero-in-left 1.9s cubic-bezier(0.33, 1, 0.68, 1) 0.3s both;
          }
          .vs-hero_title > .vs-hero_brand:last-child {
            animation-name: vs-hero-fade, vs-hero-in-right;
          }
          .vs-hero_vs {
            animation: vs-hero-vs-in 1.1s cubic-bezier(0.33, 1, 0.68, 1) 0.1s both;
          }
          @media (prefers-reduced-motion: reduce) {
            .vs-hero_layer,
            .vs-hero_brand,
            .vs-hero_vs {
              animation: none !important;
            }
          }
        </style>
      </div>
